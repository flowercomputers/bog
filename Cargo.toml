[package]
name = "bog"
version = "0.1.0"
edition = "2024"

[features]
default = ["derive"]
derive = ["dep:bog-derive"]

[dependencies]
arc-swap = "1.9.3"
bog-derive = { path = "derive", optional = true }
bytes = "1.12.1"
crc32fast = "1.5.4"
smallvec = "1.16.4"

[[test]]
name = "crash"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
